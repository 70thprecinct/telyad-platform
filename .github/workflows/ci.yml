name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      # Non-secret values used only for CI builds/tests (in-memory store + generate).
      DATABASE_URL: 'file:./services/api/prisma/ci.db'
      JWT_SECRET: 'ci-only-secret-not-used-in-production-0123456789'
      DEMO_USER_PASSWORD: 'ci-demo-password'
      NEXT_PUBLIC_API_URL: 'http://localhost:4000'
      TELYAD_ENV_LABEL: 'CI'
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @telyad/api db:generate

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

  e2e:
    runs-on: ubuntu-latest
    needs: verify
    env:
      DATABASE_URL: 'file:./prisma/e2e.db'
      JWT_SECRET: 'ci-e2e-secret-not-used-in-production-0123456789'
      DEMO_USER_PASSWORD: 'ci-demo-password'
      NEXT_PUBLIC_API_URL: 'http://localhost:4000'
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @telyad/api db:generate

      - name: Build apps
        run: pnpm build

      - name: Install Playwright browser
        run: pnpm --filter @telyad/e2e exec playwright install --with-deps chromium

      - name: Run browser E2E (demo journey + responsive)
        run: pnpm --filter @telyad/e2e e2e

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report
          if-no-files-found: ignore
          retention-days: 7
